<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <<meta
    name="description"
    content="NOVA Restaurant & Kitchen — Explore our visual menu with signature dishes, categories, and prices."
>

<meta
    name="robots"
    content="index, follow"
>

<title>Visual Menu | NOVA Restaurant & Kitchen</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>

    <div id="app">

        <!-- Header -->
        <header id="site-header">
        </header>


        <!-- Main Content -->
        <main id="main-content">

            <!-- Visual Menu Header -->
            <section id="visual-menu-header">

    <div class="container">

        <div class="visual-menu-top">

            <a
                href="index.html"
                class="back-button"
            >
                ← Back
            </a>


            <div class="visual-menu-brand">

                <span class="brand-name">
                    NOVA
                </span>

                <span class="brand-subtitle">
                    Restaurant & Kitchen
                </span>

            </div>


            <button
                type="button"
                class="language-button"
                id="language-button"
            >
                العربية
            </button>

        </div>

    </div>

</section>


            <!-- Category Navigation -->
            <nav id="visual-menu-categories">

    <div class="container">

        <div
    class="visual-menu-category-list"
    id="visual-menu-category-list"
>
</div>

    </div>

</nav>


            <!-- Menu Controls -->
            <section id="visual-menu-controls">

    <div class="container">

        <div class="menu-controls">

            <div class="view-mode-label">
                View:
            </div>

            <div class="view-mode-buttons">

                <button
                    type="button"
                    class="view-mode-button active"
                    id="cards-view-button"
                >
                    Cards
                </button>

                <button
                    type="button"
                    class="view-mode-button"
                    id="list-view-button"
                >
                    List
                </button>

            </div>

        </div>

    </div>

</section>


         <!-- Products -->
<section id="visual-menu-products">

    <div class="container">

        <div
            class="visual-menu-products"
            id="visual-menu-products-list"
        >
        </div>

    </div>

</section>



        </main>


        <!-- Footer -->
        <footer id="site-footer">

    <div class="container">

        <div class="footer-content">

            <div class="footer-brand">

                <h2>NOVA</h2>

                <p>
                    Restaurant & Kitchen
                </p>

            </div>


            <div class="footer-contact">

                <p>
                    Riyadh, Saudi Arabia
                </p>

                <p>
                    Daily: 12:00 PM – 12:00 AM
                </p>

            </div>


            <div class="footer-social">

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    WhatsApp
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 NOVA Restaurant. All rights reserved.
            </p>

        </div>

    </div>

</footer>

    </div>
    <script src="js/main.js"></script>

</body>

</html>
