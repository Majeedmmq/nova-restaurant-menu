<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
    name="description"
    content="Search the NOVA Restaurant & Kitchen menu and quickly find dishes, ingredients, and prices."
>

<meta
    name="robots"
    content="index, follow"
>

<title>Search Menu | NOVA Restaurant & Kitchen</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>

    <div id="app">

        <!-- Header -->
        <header id="site-header">
        </header>


        <!-- Main Content -->
        <main id="main-content">

            <!-- Search Header -->
            <section id="search-page-header">

    <div class="container">

        <div class="search-page-top">

            <a
                href="index.html"
                class="back-button"
            >
                ← Back
            </a>


            <div class="search-page-brand">

                <span class="brand-name">
                    NOVA
                </span>

                <span class="brand-subtitle">
                    Restaurant & Kitchen
                </span>

            </div>


            <button
                type="button"
                class="language-button"
                id="language-button"
            >
                العربية
            </button>

        </div>


        <div class="search-page-heading">

            <p class="section-label">
                Explore
            </p>

            <h1 class="search-page-title">
                Search Menu
            </h1>

        </div>

    </div>

</section>


            <!-- Search Input -->
            <section id="search-page-input">

    <div class="container">

        <div class="search-page-box">

            <input
                type="search"
                id="search-input"
                placeholder="Search dishes, drinks..."
                aria-label="Search menu"
                autocomplete="off"
            >

            <button
                type="button"
                id="search-submit"
                aria-label="Search"
            >
                Search
            </button>

        </div>

    </div>

</section>


            <!-- Popular Searches -->
            <section id="popular-searches">

    <div class="container">

        <div class="section-heading">

            <p class="section-label">
                Try Searching
            </p>

            <h2 class="section-title">
                Popular Searches
            </h2>

        </div>


        <div class="popular-search-list">

            <button
                type="button"
                class="popular-search-item"
            >
                Burger
            </button>

            <button
                type="button"
                class="popular-search-item"
            >
                Chicken
            </button>

            <button
                type="button"
                class="popular-search-item"
            >
                Pasta
            </button>

            <button
                type="button"
                class="popular-search-item"
            >
                Dessert
            </button>

            <button
                type="button"
                class="popular-search-item"
            >
                Coffee
            </button>

        </div>

    </div>

</section>


            <!-- Search Results -->
            <section id="search-results">

    <div class="container">

        <div
            class="search-results-grid"
            id="search-results-list"
        >
        </div>

        <div
            id="search-no-results"
            class="search-no-results"
            hidden
        >
            <p>No products found.</p>
        </div>

    </div>

</section>

        </main>


        <!-- Footer -->
        <footer id="site-footer">

    <div class="container">

        <div class="footer-content">

            <div class="footer-brand">

                <h2>NOVA</h2>

                <p>
                    Restaurant & Kitchen
                </p>

            </div>


            <div class="footer-contact">

                <p>
                    Riyadh, Saudi Arabia
                </p>

                <p>
                    Daily: 12:00 PM – 12:00 AM
                </p>

            </div>


            <div class="footer-social">

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    WhatsApp
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 NOVA Restaurant. All rights reserved.
            </p>

        </div>

    </div>

</footer>

    </div>
    <script src="js/main.js"></script>

</body>

</html>
